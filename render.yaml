# agent deploy: the Render service repoints from the old kumo-agent repo to
# THIS repo (KUMOSITE) with rootDir apps/agent — see RUNBOOK.md for the click-by-click.
services:
  - type: web
    name: kumo-agent
    runtime: node
    plan: starter
    rootDir: apps/agent
    # workspace install from the repo root: shared builds first (prepare), then the agent
    buildCommand: cd ../.. && npm ci -w packages/shared -w apps/agent --include-workspace-root=false && npm run build:shared && npm run build -w apps/agent
    startCommand: node dist/index.js
    healthCheckPath: /status
    envVars:
      - key: NODE_VERSION
        value: 22.x # pin LTS — node 26 breaks better-sqlite3's native compile
      - key: PRIVATE_KEY
        sync: false # hot wallet key — set in the render dashboard, never in git
      - key: CLAIMER_PRIVATE_KEY
        sync: false # pons claim wallet (optional; unset -> PRIVATE_KEY claims)
      - key: KUMO_ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # neon postgres url (recommended); omit to fall back to sqlite
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""
      - key: LLM_BASE_URL
        value: ""
      - key: PUBLIC_URL
        value: https://api.imkumoagent.com
      - key: RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: KUMO_MOCK
        value: "false"
      - key: TRADING_ENABLED
        value: "false"
      - key: TRADE_MAX_ETH
        value: "0.05"
      - key: TRADE_DAILY_MAX_ETH
        value: "0.25"
      - key: KUMO_TOKEN
        sync: false # $KUMO CA once launched
      - key: STAKING_ADDRESS
        sync: false # KumoMultiStaking CA once deployed
      - key: KUMO_EPOCH_STOCK
        value: auto
      - key: CYCLE_MINUTES
        value: "10"
      - key: DISTRIBUTE_MIN_ETH
        value: "0.05"
      - key: PER_RECIPIENT_MIN_USD
        value: "0.25"
      - key: BOOST_ENABLED
        value: "false" # boost is designed in but ships OFF
      - key: BOOST_PCT
        value: "10"
      - key: KEEPER_DRY_RUN
        value: "false" # true -> keeper plans rounds but never sends (launch rehearsal)
      - key: GAS_RESERVE_ETH
        value: "0.02"
      - key: CLAIM_ENABLED
        value: "false" # pons fee claiming (folded in from ops-panel)
      - key: CLAIM_DRY_RUN
        value: "true"
      - key: CORS_ORIGINS
        value: "https://imkumoagent.com,https://www.imkumoagent.com"
