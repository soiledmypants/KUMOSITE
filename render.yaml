services:
  # Web service (not worker) so GET /stats stays publicly reachable and Render
  # gets its port binding. First deploy boots in DRY_RUN — flip to false in the
  # dashboard once the planned txs look right.
  - type: web
    name: fee-claimer
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: fee-claimer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: PRIVATE_KEY
        sync: false
      - key: TOKEN_ADDRESS
        sync: false
      - key: TREASURY_WALLET
        sync: false
      - key: KUMO_WALLET
        sync: false
      - key: TREASURY_PCT
        value: "0"
      - key: CLAIM_MIN_ETH
        value: "0.01"
      - key: GAS_RESERVE_ETH
        value: "0.02"
      - key: MAX_FORWARD_ETH
        value: "1"
      - key: FORWARD_MIN_ETH
        value: "0.001"
      - key: INTERVAL_MINUTES
        value: "10"
