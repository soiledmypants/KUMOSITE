[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
rhc = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
rhc = { key = "verifyContract", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
